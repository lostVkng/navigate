name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUST_TOOLCHAIN: 1.98.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +"$RUST_TOOLCHAIN" fmt --all -- --check
      - name: Run tests
        run: cargo +"$RUST_TOOLCHAIN" test --locked --all-features
      - name: Run Clippy
        run: cargo +"$RUST_TOOLCHAIN" clippy --locked --all-targets --all-features -- -D warnings
